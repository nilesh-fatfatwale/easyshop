  destination:
    server: https://DCF3F3EC0342140D3F58C40BB9B99E54.gr7.us-east-1.eks.amazonaws.com
    namespace: easyshop 
  syncPolicy:
    automated:                  
      prune: true               
      selfHeal: true 
    syncOptions:
      - CreateNamespace=true
            
