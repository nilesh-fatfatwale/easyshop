apiVersion: argoproj.io/v1alpha1 
kind: Application               
metadata:
  name: easyshop               
  namespace: argocd           
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.email: "nileshfatfatwale007@gmail.com"
