apiVersion: argoproj.io/v1alpha1 
kind: Application               
metadata:
  name: easyshop               
  namespace: argocd           
  annotations:
    argocd-image-updater.argoproj.io/image-list: easyshop=nileshfatfatwale/easyshop 
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git-creds 
    argocd-image-updater.argoproj.io/easyshop.update-strategy: semver 
    notifications.argoproj.io/subscribe.on-deployed.email: "nileshfatfatwale007@gmail.com"
    notifications.argoproj.io/subscribe.on-health-degraded.email: "nileshfatfatwale007@gmail.com"
spec:
  project: default              
  source:
    repoURL: https://github.com/nilesh-fatfatwale/easyshop.git 
    targetRevision: dev        
    path: kubernetes 
  destination:
    server: https://83E199C17F5797EFFF7281AA2F1AA42B.gr7.us-east-1.eks.amazonaws.com
    namespace: easyshop 
  syncPolicy:
    automated:                  
      prune: true               
      selfHeal: true 
    syncOptions:
      - CreateNamespace=true
            
