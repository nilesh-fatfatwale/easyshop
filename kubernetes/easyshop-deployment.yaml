apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyshop:v1.1.1
  namespace: easyshop:v1.1.1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: easyshop:v1.1.1
  template:
    metadata:
      labels:
        app: easyshop:v1.1.1
    spec:
      containers:
        - name: easyshop:v1.1.1
          image: nileshfatfatwale/easyshop:v1.1.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: easyshop:v1.1.1
            - secretRef:
                name: easyshop:v1.1.1
          env:
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: easyshop:v1.1.1
                  key: NEXTAUTH_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: easyshop:v1.1.1
                  key: NEXTAUTH_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: easyshop:v1.1.1
                  key: JWT_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 25
            periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: easyshop:v1.1.1
  namespace: easyshop:v1.1.1
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30000
  selector:
    app: easyshop:v1.1.1
